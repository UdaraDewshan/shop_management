<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopManage | Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="asset/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">
                <i class="fa-solid fa-layer-group me-2"></i>ShopManage
            </a>
            <button class="btn btn-custom-add rounded-pill px-4" onclick="openAddModal()">
                <i class="fa-solid fa-plus me-2"></i>Add Product
            </button>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row mb-5 text-center fade-in-up">
            <div class="col-lg-8 mx-auto mt-5">
                <h1 class="display-4 fw-bold text-white">Inventory Dashboard</h1>
                <p class="lead text-white-50">Manage your products with style and precision.</p>
            </div>
        </div>

        <div id="loader" class="text-center my-5">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden load">Loading...</span>
            </div>
            <p class="text-white mt-2">Fetching Products...</p>
        </div>

        <div class="row g-4" id="productGrid">
            </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="modalTitle">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">

                        <div class="mb-3">
                            <label class="form-label">Product image </label>
                            <input type="text" class="form-control glass-input" id="thumbnail" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Product Title</label>
                            <input type="text" class="form-control glass-input" id="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" class="form-control glass-input" id="price" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select glass-input" id="category" required>
                                <option value="beauty">Beauty</option>
                                <option value="fragrances">Fragrances</option>
                                <option value="furniture">Furniture</option>
                                <option value="groceries">Groceries</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-custom-submit submit">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="asset/js/app.js"></script>
</body>
</html>
